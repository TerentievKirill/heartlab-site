<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heartlab — tiny apps for self-love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Heartlab is a tiny one-person studio creating gentle mobile apps to make life a little softer.">

  <style>
    :root {
      --bg1: #ffd6e6;
      --bg2: #ffe5cc;
      --bg3: #ffdede;
      --card-bg: rgba(255,255,255,0.55);
      --card-border: rgba(255,255,255,0.8);
      --accent: #ff6ea7;
      --accent-dark: #ff4f93;
      --text-main: #2f2f2f;
      --text-soft: #555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", "Nunito", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 200% 200%;
      animation: gradientMove 14s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .shell {
      width: 100%;
      max-width: 520px;
      padding: 28px 24px 22px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 40px rgba(255,150,190,0.35);
      backdrop-filter: blur(14px);
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .subtitle {
      font-size: 17px;
      color: var(--text-soft);
      margin-bottom: 18px;
    }
    .text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-soft);
      margin-bottom: 22px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.16s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255,110,167,0.45);
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: rgba(255,255,255,0.8);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.9);
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.55);
      margin: 0 0 10px;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(0,0,0,0.6);
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .footer a {
      color: rgba(0,0,0,0.7);
      text-decoration: none;
      border-bottom: 1px dotted rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>
  <main class="shell">
    <h1>Heartlab</h1>
    <p class="subtitle" id="subtitle"></p>

    <p class="text" style="margin-top:12px; font-size:14px;">
      <span id="contactLabel"></span>
      <a href="mailto:hello@heartlab.app" style="color:var(--accent); text-decoration:none;">
        hello@heartlab.app
      </a>
    </p>

    <p class="text" id="text1"></p>
    <p class="text" id="text2"></p>

    <p class="section-title" id="appsTitle"></p>
    <div class="btn-row">
      <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.lovetodo.app" target="_blank">Google Play</a>
      <a class="btn btn-primary" href="https://apps.apple.com/us/app/love-to-do-heart-reminders/id6756277592" target="_blank">App Store</a>
    </div>

    <p class="section-title" id="socialTitle" style="margin-top:18px;"></p>
    <div class="btn-row">
      <a class="btn btn-ghost" href="https://www.tiktok.com/@heartlab.app" target="_blank">TikTok</a>
      <a class="btn btn-ghost" href="https://www.instagram.com/heartlab.app/" target="_blank">Instagram</a>
      <a class="btn btn-ghost" href="https://www.youtube.com/channel/UCXUhbBoTTpz3ajGLNJZUX-Q" target="_blank">YouTube</a>
    </div>

    <div class="footer">
      <span>© 2025 Heartlab</span>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
    </div>
  </main>

  <script>
    const T = {
      en: {
        subtitle: "a tiny one-person studio",
        contact: "Contact:",
        t1: "Hi 👋 I'm a one-person studio building gentle little apps that make life feel a bit softer.",
        t2: "My mission is simple: create small, warm digital things that help you breathe easier.",
        apps: "apps",
        social: "social"
      },
      ru: {
        subtitle: "небольшая студия одного человека",
        contact: "Контакт:",
        t1: "Привет 👋 Я создаю тёплые приложения, которые делают жизнь чуть мягче.",
        t2: "Моя миссия — маленькие цифровые вещи, которые помогают дышать спокойнее.",
        apps: "приложения",
        social: "соцсети"
      },
      es: {
        subtitle: "un pequeño estudio de una sola persona",
        contact: "Contacto:",
        t1: "Hola 👋 Creo aplicaciones suaves que hacen la vida un poco más ligera.",
        t2: "Mi misión es crear pequeñas cosas digitales que te ayuden a respirar mejor.",
        apps: "aplicaciones",
        social: "redes"
      }
    };

    const l = navigator.language.toLowerCase();
    const lang = l.startsWith("ru") ? "ru" : l.startsWith("es") ? "es" : "en";
    const t = T[lang];

    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("contactLabel").textContent = t.contact;
    document.getElementById("text1").textContent = t.t1;
    document.getElementById("text2").textContent = t.t2;
    document.getElementById("appsTitle").textContent = t.apps;
    document.getElementById("socialTitle").textContent = t.social;
  </script>
</body>
</html>
