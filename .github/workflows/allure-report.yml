name: Allure Report

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  allure:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.ALLURE_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Download latest Allure results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads allure-results

          download_latest_artifact() {
            local repo="$1"
            local artifact_name="$2"
            local output_dir="$3"

            local run_id
            run_id=$(gh api \
              "repos/${repo}/actions/artifacts?name=${artifact_name}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')

            if [ -z "$run_id" ]; then
              echo "No valid artifact found: ${repo} / ${artifact_name}"
              exit 1
            fi

            echo "Downloading ${artifact_name} from run ${run_id}"
            gh run download "$run_id" \
              --repo "$repo" \
              --name "$artifact_name" \
              --dir "$output_dir"
          }

          download_latest_artifact \
            TerentievKirill/BookFerry \
            bookferry-smoke-allure-results \
            downloads/server-smoke

          download_latest_artifact \
            TerentievKirill/BookFerry \
            bookferry-e2e-allure-results \
            downloads/server-e2e

          download_latest_artifact \
            TerentievKirill/BookFerryBot \
            bookferrybot-e2e-allure-results \
            downloads/bot-e2e

          cp -a downloads/server-smoke/. allure-results/
          cp -a downloads/server-e2e/. allure-results/
          cp -a downloads/bot-e2e/. allure-results/

      - name: Preserve Allure history
        run: |
          if [ -d allure/history ]; then
            cp -r allure/history allure-results/history
          fi

      - name: Generate combined report
        run: allure generate allure-results --clean -o allure

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allure

          if git diff --cached --quiet; then
            echo "Allure report has not changed"
            exit 0
          fi

          git commit -m "update Allure report"
          git push
