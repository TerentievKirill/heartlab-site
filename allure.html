<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookFerry Allure Reports</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111210;
      color: #f2f2ef;
    }

    main {
      width: min(520px, calc(100% - 32px));
    }

    h1 {
      margin: 0 0 24px;
      font-size: 38px;
      letter-spacing: -0.04em;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      background: #1b1c1a;
    }

    a:hover {
      border-color: #8da4ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>BookFerry test reports</h1>
    <div class="links">
      <a href="https://terentievkirill.github.io/BookFerry/">Backend Allure</a>
      <a href="https://terentievkirill.github.io/BookFerryBot/">Bot Allure</a>
    </div>
  </main>
</body>
</html>
